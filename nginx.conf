# ============================================================
# Smart Traffic AI — Nginx Reverse Proxy Configuration
# Single Public Origin Architecture
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance & Timeouts
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 500M;      # Support large video uploads (up to 500MB)
    proxy_read_timeout 600s;        # Allow long video processing jobs (up to 10 mins)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 80;
        server_name localhost _;

        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # ── 1. Next.js Frontend ─────────────────────────────────
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 2. FastAPI Backend API ──────────────────────────────
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 3. FastAPI OpenAPI Docs & Schema ───────────────────
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # ── 4. Static Evidence Files (Images & H.264 Videos) ────
        location /static/ {
            proxy_pass http://backend:8000/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Enable byte-range requests for smooth HTML5 video scrubbing
            proxy_force_ranges on;
            add_header Accept-Ranges bytes;
        }
    }
}
